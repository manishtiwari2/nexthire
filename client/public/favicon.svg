<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NextHire">
  <title>NextHire</title>
  <!--
    Favicon build of the mark. Deliberately not identical to logo.svg: at 16px the
    full-size proportions turn to mush, so the glyph is tightened, the stroke thickened
    and the node enlarged. The tile also loses a little corner radius, which reads as
    the same shape once it is 16px square.
  -->
  <defs>
    <linearGradient id="nhFav" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#nhFav)"/>

  <path d="M18 47V17L46 46V22"
        fill="none" stroke="#fff" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="46" cy="17" r="6.5" fill="#a78bfa"/>
</svg>
