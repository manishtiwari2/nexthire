<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 64" width="232" height="64" role="img" aria-label="NextHire — DSA Platform">
  <title>NextHire — DSA Platform</title>
  <!--
    Horizontal lockup: mark + wordmark. Use this in the sidebar, README and any
    place with room for the name. Where space is tight, use logo.svg on its own.

    The text is live SVG text rather than outlined paths, so it renders in Inter
    wherever Inter is loaded (the app loads it in index.html) and falls back to the
    system UI sans elsewhere.
  -->
  <defs>
    <linearGradient id="nhTileW" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#nhTileW)"/>
  <path d="M21 45.5V19.5L43 44.5V23"
        fill="none" stroke="#fff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="43" cy="18.5" r="5.5" fill="#a78bfa"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="80" y="34" font-size="25" font-weight="700" letter-spacing="-.6" fill="#e7e9ee">NextHire</text>
    <text x="81" y="49" font-size="9.5" font-weight="600" letter-spacing="2.4" fill="#6b7280">DSA PLATFORM</text>
  </g>
</svg>
