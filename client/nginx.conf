# Serves the built SPA and reverse-proxies the API on the same origin.
#
# Same-origin matters: the refresh token lives in a SameSite cookie, so putting the API under
# /api on this host avoids cross-site cookie rules entirely (no SameSite=None, no CORS
# pre-flight on every call).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Submissions can carry a large source file; keep this above the API's own 1 MB JSON cap.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed assets (including the ~1 MB monaco chunk) are immutable — cache hard so
    # returning visitors never re-download the editor.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The judge can take a few seconds; do not cut a submission off mid-flight.
        proxy_read_timeout 120s;
    }

    # Socket.IO needs the upgrade headers and a long read timeout, or idle sockets get culled
    # and the IDE silently falls back to polling.
    location /socket.io/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Client-side routing: every unknown path is an SPA route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
